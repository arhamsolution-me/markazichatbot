<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markazi AI — Data Chatbot</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
    <div class="chat-app landing-mode" id="app-root">
        <!-- Top Navigation Bar -->
        <header class="app-header">
            <div class="header-container">
                <div class="brand">
                    <div class="brand-icon">
                        <span>✦</span>
                    </div>
                    <div class="brand-info">
                        <h1>Markazi <span>AI</span></h1>
                        <span class="status-indicator" id="status-indicator">
                            <span class="status-dot"></span> PostgreSQL Connected (IS • US • LS Linked)
                        </span>
                    </div>
                </div>

                <div class="header-right">
                    <button id="history-toggle-btn" class="header-btn" title="View chat history">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        History
                    </button>
                    <button id="sync-btn" class="header-btn" title="Sync database metadata">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                        </svg>
                        Sync Data
                    </button>
                    <button id="clear-chat-btn" class="header-btn primary-header-btn" title="Start a fresh chat">
                        + New Chat
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Workspace Area -->
        <div class="workspace-area">
            <!-- Centered Landing Title (Visible only at start) -->
            <div class="landing-hero" id="landing-hero">
                <h1 class="landing-title">Markazi <span>AI</span></h1>
            </div>

            <!-- Main Chat Viewport (Active chat stream) -->
            <main class="chat-viewport" id="chat-viewport">
                <div class="chat-container" id="chat-messages">
                    <!-- Messages will be appended dynamically -->
                </div>
            </main>

            <!-- Interaction Area (Centered at start, docks at bottom when chatting) -->
            <div class="interaction-container" id="interaction-container">
                <div class="interaction-inner">
                    <form id="chat-form" class="chat-form">
                        <div class="input-box">
                            <textarea 
                                id="user-input" 
                                placeholder="Ask anything about your data..." 
                                rows="1"
                                required
                            ></textarea>
                            <button type="submit" id="send-btn" class="send-btn" title="Send message">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Offcanvas Slide-over History Drawer -->
        <div class="history-backdrop" id="history-backdrop"></div>
        <aside class="history-drawer" id="history-drawer">
            <div class="drawer-header">
                <div class="drawer-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <h3>Chat History</h3>
                </div>
                <button id="close-history-btn" class="drawer-close-btn" title="Close drawer">✕</button>
            </div>
            <div class="drawer-actions">
                <button id="drawer-new-chat-btn" class="drawer-action-btn primary-btn">+ New Chat</button>
                <button id="clear-all-history-btn" class="drawer-action-btn danger-btn" title="Delete all history">Clear All</button>
            </div>
            <div class="drawer-content" id="history-list">
                <!-- Dynamically populated session cards -->
                <div class="history-empty">No previous chats found.</div>
            </div>
        </aside>
    </div>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Script -->
    <script src="app.js"></script>
</body>
</html>
